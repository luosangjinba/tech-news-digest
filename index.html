<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Digest - 科技新闻</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #333;
        }
        h1 { 
            font-size: 2.5em; 
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; font-size: 1.1em; }
        .update-time { color: #4ade80; margin-top: 10px; }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .nav a {
            color: #4ade80;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #4ade80;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .nav a:hover, .nav a.active {
            background: #4ade80;
            color: #0f0f23;
        }
        
        .date-select {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .date-select button {
            padding: 10px 20px;
            background: #1e1e3f;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .date-select button:hover {
            background: #252550;
            border-color: #4ade80;
        }
        
        .category {
            margin: 40px 0;
        }
        .category h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background: #1e1e3f;
            border-radius: 12px 12px 0 0;
            border-left: 4px solid #4ade80;
        }
        .category h2 .icon { font-size: 1.5em; }
        
        .news-list {
            background: #1e1e3f;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
        }
        
        .news-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            transition: background 0.3s;
        }
        .news-item:hover { background: #252550; }
        .news-item:last-child { border-bottom: none; }
        
        .news-number {
            min-width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            border-radius: 50%;
            font-weight: bold;
            color: #4ade80;
        }
        .news-content { flex: 1; }
        .news-title {
            color: #fff;
            text-decoration: none;
            font-size: 1.05em;
            display: block;
            margin-bottom: 5px;
        }
        .news-title:hover { color: #4ade80; }
        .news-meta {
            font-size: 0.85em;
            color: #888;
        }
        
        .github-section {
            margin-top: 60px;
            padding: 30px;
            background: #1e1e3f;
            border-radius: 12px;
        }
        .github-section h2 {
            margin-bottom: 20px;
            color: #fff;
        }
        .repo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #333;
        }
        .repo-item:last-child { border-bottom: none; }
        .repo-name {
            color: #4ade80;
            text-decoration: none;
            font-weight: bold;
        }
        .repo-stars { color: #ffd700; }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        
        footer {
            text-align: center;
            padding: 40px;
            color: #666;
            border-top: 1px solid #333;
            margin-top: 60px;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .news-item { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 Tech News Digest</h1>
            <p class="subtitle">AI · 机器人 · 生物医药 · 航空航天</p>
            <p class="update-time" id="updateTime">加载中...</p>
        </header>
        
        <nav class="nav">
            <a href="?cat=all" id="navAll">全部</a>
            <a href="?cat=ai" id="navAI">🤖 AI</a>
            <a href="?cat=robotics" id="navRobotics">🦾 机器人</a>
            <a href="?cat=biotech" id="navBiotech">🧬 生物医药</a>
            <a href="?cat=aerospace" id="navAerospace">🚀 航空航天</a>
            <a href="?cat=github" id="navGithub">⭐ GitHub</a>
        </nav>
        
        <div id="content">
            <div class="loading">加载中...</div>
        </div>
        
        <footer>
            <p>由 GitHub Actions 驱动 · 每小时更新</p>
            <p>数据源: Hacker News, TechCrunch, IEEE Spectrum, ScienceDaily, NASA</p>
        </footer>
    </div>
    
    <script>
        const NEWS_DIR = 'news';
        
        // 获取URL参数
        function getParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            });
        }
        
        // 加载新闻列表
        async function loadNewsList() {
            try {
                // 这里简化处理，实际应该读取索引文件
                const dates = [];
                const today = new Date();
                
                for (let i = 0; i < 7; i++) {
                    const d = new Date(today);
                    d.setDate(d.getDate() - i);
                    dates.push(d.toISOString().split('T')[0]);
                }
                
                return dates;
            } catch (error) {
                console.error('加载日期列表失败:', error);
                return [new Date().toISOString().split('T')[0]];
            }
        }
        
        // 加载分类新闻
        async function loadCategory(category, date) {
            try {
                const response = await fetch(`${NEWS_DIR}/${date}/${category}.json`);
                if (!response.ok) return [];
                return await response.json();
            } catch (error) {
                return [];
            }
        }
        
        // 渲染新闻
        function renderNews(category, news) {
            const categoryNames = {
                'ai': { name: 'AI 人工智能', icon: '🤖' },
                'robotics': { name: '机器人', icon: '🦾' },
                'biotech': { name: '生物医药', icon: '🧬' },
                'aerospace': { name: '航空航天', icon: '🚀' },
            };
            
            if (!news || news.length === 0) {
                return `<div class="loading">暂无新闻</div>`;
            }
            
            const info = categoryNames[category] || { name: category, icon: '📰' };
            let html = `<div class="category">
                <h2><span class="icon">${info.icon}</span> ${info.name}</h2>
                <div class="news-list">`;
            
            news.forEach((item, index) => {
                const title = item.title_zh || item.title || '无标题';
                const link = item.link || '#';
                const source = item.source || '';
                
                html += `
                    <div class="news-item">
                        <div class="news-number">${index + 1}</div>
                        <div class="news-content">
                            <a href="${link}" target="_blank" class="news-title">${title}</a>
                            <div class="news-meta">${source}</div>
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }
        
        // 渲染GitHub热门
        async function renderGithub() {
            try {
                const response = await fetch('github-trending.json');
                if (!response.ok) {
                    return `<div class="loading">暂无数据</div>`;
                }
                const repos = await response.json();
                
                let html = `<div class="github-section">
                    <h2>⭐ GitHub 热门项目</h2>`;
                
                repos.forEach((repo, index) => {
                    html += `
                        <div class="repo-item">
                            <a href="${repo.html_url}" target="_blank" class="repo-name">${repo.full_name}</a>
                            <span class="repo-stars">⭐ ${repo.stargazers_count?.toLocaleString() || 0}</span>
                        </div>
                    `;
                });
                
                html += `</div>`;
                return html;
            } catch (error) {
                return `<div class="loading">加载失败</div>`;
            }
        }
        
        // 主渲染
        async function render() {
            const category = getParam('cat') || 'all';
            const date = getParam('date') || new Date().toISOString().split('T')[0];
            
            // 更新导航状态
            document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
            const activeNav = document.getElementById('nav' + category.charAt(0).toUpperCase() + category.slice(1));
            if (activeNav) activeNav.classList.add('active');
            
            document.getElementById('updateTime').textContent = `最后更新: ${formatDate(date)}`;
            
            const content = document.getElementById('content');
            
            if (category === 'github') {
                content.innerHTML = await renderGithub();
                return;
            }
            
            if (category === 'all') {
                const categories = ['ai', 'robotics', 'biotech', 'aerospace'];
                let html = '';
                for (const cat of categories) {
                    const news = await loadCategory(cat, date);
                    html += renderNews(cat, news);
                }
                content.innerHTML = html || '<div class="loading">暂无新闻</div>';
            } else {
                const news = await loadCategory(category, date);
                content.innerHTML = renderNews(category, news);
            }
        }
        
        // 初始化
        render();
    </script>
</body>
</html>
