name: Hourly News Update

on:
  schedule:
    # 每15分钟运行一次 (UTC) = 每小时整点、15分、30分、45分
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser
          
      - name: Fetch news
        run: |
          python scripts/fetch_news.py
          
      - name: Translate titles
        run: |
          python scripts/translate.py
          
      - name: Push latest news to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_telegram.py hourly
          
      - name: Commit and push
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news/ index.html
          git diff --staged --quiet || git commit -m "Update news $(date +%Y-%m-%d\ %H:%M)"
          git push
