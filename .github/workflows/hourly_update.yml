name: Hourly News Update

on:
  schedule:
    # 每小时运行一次 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser
          
      - name: Fetch news
        run: |
          python scripts/fetch_news.py
          
      - name: Translate titles
        run: |
          python scripts/translate.py
          
      - name: Debug: Check news files
        run: |
          echo "=== News files ==="
          find news -name "*.json" -type f
          echo "=== Today's news ==="
          cat news/$(date +%Y-%m-%d)/ai.json 2>/dev/null | head -5 || echo "No ai.json"
          
      - name: Push latest news to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_telegram.py hourly
          
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news/ index.html
          git diff --staged --quiet || git commit -m "Update news $(date +%Y-%m-%d\ %H:%M)"
          git push
