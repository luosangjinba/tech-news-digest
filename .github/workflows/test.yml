name: Test News

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install deps
        run: pip install requests feedparser
      
      - name: Run fetch
        run: python scripts/fetch_news.py
      
      - name: Show news
        run: |
          echo "=== Tech ===" && cat news/2026-03-08/tech.json
          echo "=== Finance ===" && cat news/2026-03-08/finance.json
          echo "=== Invest ===" && cat news/2026-03-08/invest.json
